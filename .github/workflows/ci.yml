name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar dependencias de Expo
        run: npx expo-doctor

      - name: Verificar formato
        run: npm run format:check

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Ejecutar ESLint
        run: npm run lint -- --max-warnings=0

      - name: Ejecutar pruebas y cobertura
        run: npm run test:coverage

  database:
    name: Migraciones y reglas de Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar migraciones y ejecutar pruebas SQL
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: bash scripts/test-supabase-migrations.sh

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Probar la lógica compartida
        run: node --experimental-strip-types --test supabase/functions/tests/*_test.ts

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos de las funciones
        run: >-
          deno check
          supabase/functions/generate-report-pdf/index.ts
          supabase/functions/send-push/index.ts
          supabase/functions/cleanup-photos/index.ts
